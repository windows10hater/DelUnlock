name: Build and Release DelUnlock

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            vcvars: x64
            subsystem: "5.02"
            outname: DelUnlock-x64.exe
          - arch: x86
            vcvars: x86
            subsystem: "5.01"
            outname: DelUnlock-x86.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}

      - name: Compile Resource
        shell: cmd
        run: |
          if not exist build mkdir build
          rc.exe /nologo /fo build\resource.res res\resource.rc

      - name: Compile Standalone Executable
        shell: cmd
        run: |
          cl.exe /nologo /O2 /Ob2 /Oi /Os /GL /GS- /EHsc /std:c++17 /MT ^
            /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX ^
            /D_USING_V110_SDK71_ /D_WIN32_WINNT=0x0501 ^
            src\xp_compat.cpp src\main.cpp src\unlocker.cpp src\ui.cpp src\config.cpp ^
            build\resource.res ^
            /Fe:${{ matrix.outname }} /Fo:build\ ^
            /link /LTCG /OPT:REF /OPT:ICF /SUBSYSTEM:WINDOWS,${{ matrix.subsystem }} ^
            user32.lib gdi32.lib shell32.lib shlwapi.lib comctl32.lib comdlg32.lib ^
            advapi32.lib psapi.lib version.lib uxtheme.lib ole32.lib oleaut32.lib oleacc.lib uuid.lib

      - name: Calculate Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.outname }}).Hash
          "$hash  ${{ matrix.outname }}" | Out-File -FilePath "${{ matrix.outname }}.sha256" -Encoding ascii
          Get-Content "${{ matrix.outname }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outname }}
          path: |
            ${{ matrix.outname }}
            ${{ matrix.outname }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir release_dist
          find artifacts -type f \( -name "*.exe" -o -name "*.sha256" \) -exec cp {} release_dist/ \;
          cd release_dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/DelUnlock-x64.exe
            release_dist/DelUnlock-x86.exe
            release_dist/SHA256SUMS.txt
          generate_release_notes: true
