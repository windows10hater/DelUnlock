name: Build and Release DelUnlock

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            vcvars: x64
            subsystem: "5.02"
            outname: DelUnlock-x64.exe
          - arch: x86
            vcvars: x86
            subsystem: "5.01"
            outname: DelUnlock-x86.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}

      - name: Compile Standalone Executable
        shell: cmd
        run: |
          call build.bat ${{ matrix.arch }}
          if not exist ${{ matrix.outname }} copy /Y DelUnlock.exe ${{ matrix.outname }}

      - name: Calculate Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.outname }}).Hash
          "$hash  ${{ matrix.outname }}" | Out-File -FilePath "${{ matrix.outname }}.sha256" -Encoding ascii
          Get-Content "${{ matrix.outname }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outname }}
          path: |
            ${{ matrix.outname }}
            ${{ matrix.outname }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir release_dist
          find artifacts -type f \( -name "*.exe" -o -name "*.sha256" \) -exec cp {} release_dist/ \;
          cd release_dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Extract Release Notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/## \[${TAG_VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_dist/RELEASE_NOTES.md
          if [ ! -s release_dist/RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_dist/RELEASE_NOTES.md
          fi
          cat release_dist/RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DelUnlock ${{ github.ref_name }}
          body_path: release_dist/RELEASE_NOTES.md
          files: |
            release_dist/DelUnlock-x64.exe
            release_dist/DelUnlock-x86.exe
            release_dist/SHA256SUMS.txt
